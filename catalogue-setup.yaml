- name: setup catalogue
  hosts: catalogue
  become: yes
  tasks: 
  - name: disable nodejs
    ansible.builtin.command: dnf module disable nodejs -y
      
  - name: enable nodejs
    ansible.builtin.command: dnf module enable nodejs:20 -y
  
  - name: install nodejs
    ansible.builtin.dnf:
      name: nodejs
      state: present

  - name: create system user roboshop
    ansible.builtin.user:
    name: roboshop
    comment: roboshop system user
    shell: /sbin/nologin
    home: /app
    system: true

  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory


  - name: Download zip file
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip 
      dest: /tmp/catalogue.zip

  - name: Extract zip file
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes

  - name: Run npm install in /app
    ansible.builtin.command: npm install
    args:
      chdir: /app

  - name: Copy catalogue service file
    ansible.builtin.copy:
      src: catalogue.service
      dest: /etc/systemd/system/catalogue.service
  
  - name: Reload systemd daemon
    ansible.builtin.systemd:
      daemon_reload: true

  - name: start and enable catalogue
    ansible.builtin.service:
      name: catalogue
      state: restarted
      enabled: yes

  - name: Copy mongo repo
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  
  - name: install mongo client
    ansible.builtin.dnf:
      name: mongodb-mongosh
      state: present

  
- name: Load MongoDB schema
  ansible.builtin.shell: "mongosh --host mongodb.yaswanthreddypenchikala.online < /app/db/master-data.js"